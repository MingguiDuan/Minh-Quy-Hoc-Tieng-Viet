<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chào Miền Nam · 南部越南语入门</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f4;--card:#fff;--ink:#14262b;--mute:#58706f;--line:#d3dfdb;--river:#2f7f86;--lotus:#b83a6b;--sun:#f3d08a;--ok:#1f7a4d;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0f1c1f;--card:#17292d;--ink:#e8f1ee;--mute:#9bb3b0;--line:#2a4246;--river:#5bbcc4;--lotus:#f08ab0;--sun:#6b5a2c;--ok:#6fd49c;--bad:#ff8a80}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Be Vietnam Pro","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
header{padding:20px 16px 8px;max-width:720px;margin:0 auto}
h1{font-size:1.5rem;margin:0;color:var(--lotus)}
header p{margin:2px 0 0;color:var(--mute);font-size:.9rem}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:720px;margin:0 auto;border-bottom:1px solid var(--line)}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:20px;font:inherit;font-size:.9rem;cursor:pointer}
nav button[aria-current=true]{background:var(--river);color:#fff;border-color:var(--river)}
main{max-width:720px;margin:0 auto;padding:16px}
section h2{font-size:1.15rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.note{background:var(--sun);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:.9rem;margin-bottom:12px}
@media(prefers-color-scheme:dark){.note{color:#fff}}
button{font:inherit}
.play{border:0;background:var(--river);color:#fff;border-radius:50%;width:38px;height:38px;cursor:pointer;flex:none}
.play.slow{background:transparent;color:var(--river);border:1.5px solid var(--river);font-size:.75rem;width:auto;padding:0 10px;border-radius:19px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.big{font-size:2.4rem;font-weight:700;line-height:1.1;min-width:2.2em}
.vi{font-weight:600}.zh{color:var(--mute);font-size:.92rem}
.btn{border:1px solid var(--river);color:var(--river);background:transparent;border-radius:8px;padding:6px 12px;cursor:pointer}
.btn.fill{background:var(--river);color:#fff}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.opt.right{border-color:var(--ok);color:var(--ok)}.opt.wrong{border-color:var(--bad);color:var(--bad)}
.fb{min-height:1.4em;font-size:.9rem;margin-top:4px}
input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
.hide{filter:blur(6px);cursor:pointer;user-select:none}
a{color:var(--river)}
:focus-visible{outline:3px solid var(--lotus);outline-offset:2px}
@media(prefers-reduced-motion:no-preference){.opt,.btn,nav button{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<header><h1>Chào Miền Nam</h1><p>南部越南语入门 · 中文讲解，英文按需 · <span id="prog"></span></p></header>
<nav id="nav" aria-label="模块"></nav>
<main id="app"><p>加载中…</p></main>
<script>
const TABS=[["letters","字母"],["tones","声调"],["dialogues","对话"],["vocab","词汇"],["listen","听力"],["reading","阅读"],["review","复习"]];
let D=null,cur="letters",showEn=false;
const $=s=>document.querySelector(s);
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let audioEl=null;
function play(id,text,slow){
  if(audioEl){audioEl.pause()}
  const a=new Audio("audio/"+id+(slow?"-slow":"")+".mp3");audioEl=a;
  a.onerror=()=>{if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(text);u.lang="vi-VN";u.rate=slow?.55:.9;speechSynthesis.cancel();speechSynthesis.speak(u)};
  a.play().catch(()=>a.onerror());
}
function pb(id,text){return `<button class="play" aria-label="播放 ${esc(text)}" data-p="${id}" data-t="${esc(text)}">▶</button><button class="play slow" aria-label="慢速播放" data-p="${id}" data-t="${esc(text)}" data-s="1">慢</button>`}
function mark(id,ok,key){if(!key)return;let w=store.get("wrong",{});if(ok){delete w[id]}else{w[id]=key}store.set("wrong",w)}
function quiz(id,q,opts,ans,extra){
  return `<div class="card" data-q="${id}" data-a="${ans}">${extra||""}<div class="vi">${q}</div>${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}<div class="fb" role="status"></div></div>`}
const isDone=k=>!!store.get('done',{})[k];
const doneBtn=(k)=>`<button class="btn ${isDone(k)?'fill':''}" data-done="${esc(k)}">${isDone(k)?'✓ 已学完':'标记学完'}</button>`;
const VIEWS={
 letters(){return D.letters.map(g=>`<section><h2>${isDone('g:'+g.group)?'✓ ':''}${g.group}</h2><div class="note">${g.trap}</div>${g.items.map(it=>`
  <div class="card"><div class="row"><span class="big">${it.letter}</span><div><div class="zh">字母名</div><div class="vi">${it.name}</div></div>${pb(it.id,it.say)}</div>
  ${it.words.map(w=>`<div class="row" style="margin-top:8px"><div style="flex:1"><span class="vi">${w.vi}</span> <span class="zh">${w.zh}</span></div>${pb(w.id,w.vi)}</div>`).join("")}</div>`).join("")}${doneBtn('g:'+g.group)}</section>`).join("")},
 tones(){const T=D.tones;return `<section><h2>六种写法，南部听成五种</h2><div class="note">${T.note}</div>
  <div class="card">${T.desc.map(d=>`<div><span class="vi">${d[0]}</span> <span class="zh">${d[1]}</span></div>`).join("")}</div>
  ${T.words.map(w=>`<div class="card row"><div style="flex:1"><span class="vi" style="font-size:1.4rem">${w.vi}</span> <span class="zh">${w.zh} · ${w.tone}</span></div>${pb(w.id,w.vi)}</div>`).join("")}
  <h2>听辨</h2>${T.words.filter(w=>w.tone).slice(0,6).map(w=>quiz("tq-"+w.id,"听音，选声调",T.classes,T.classes.indexOf(w.tone),`<div class="row">${pb(w.id,w.vi)}</div>`)).join("")}<h2>句子语调与停顿</h2>${T.intonation.map(x=>`<div class="card row"><div style="flex:1"><div class="vi">${x.vi}</div><div class="zh">${x.zh}</div><div class="zh">${x.note}</div></div>${pb(x.id,x.vi)}</div>`).join("")}${doneBtn('g:tones')}</section>`},
 dialogues(){return D.dialogues.map(d=>`<section><h2>${isDone('d:'+d.id)?'✓ ':''}${d.title}</h2><div class="note">${d.note}</div>
  <div class="row" style="margin-bottom:8px"><button class="btn" data-en>${showEn?"隐藏":"显示"}英文</button><button class="btn" data-rec="${d.id}">● 录音</button><button class="btn" data-playrec="${d.id}" hidden>▶ 回放我的声音</button></div>
  ${d.lines.map(l=>`<div class="card row"><div style="flex:1"><div class="vi">${l.who}：${l.vi}</div><div class="zh">${l.zh}</div>${showEn?`<div class="zh">${l.en}</div>`:""}</div>${pb(l.id,l.vi)}</div>`).join("")}<div class="zh">录音只保存在本机浏览器里，不会上传。</div><div style="margin-top:8px">${doneBtn('d:'+d.id)}</div></section>`).join("")},
 vocab(){return `<section><h2>词汇</h2><input type="search" id="q" placeholder="用中文、英文或越南语查（不打声调也行）"><div class="row" style="margin-bottom:10px"><label><input type="checkbox" id="hideZh"> 先隐藏释义自测</label></div><div id="vlist"></div>
  <div class="card zh">课外查词：<a href="https://www.google.com/search?q=C%E1%BB%93+Vi%E1%BB%87t" target="_blank" rel="noopener">Cồ Việt</a> · <a href="https://vdict.com" target="_blank" rel="noopener">VDict</a></div></section>`},
 listen(){return `<section><h2>听一句，选意思</h2>${D.listening.map(l=>quiz(l.id,"听音，选意思",l.options,l.answer,`<div class="row">${pb(l.say,l.vi)}</div>`)).join("")}</section>`},
 reading(){return D.reading.map(r=>`<section><h2>${isDone('r:'+r.id)?'✓ ':''}${r.title}</h2>${r.sentences.map(s=>`<div class="card row"><div style="flex:1"><div class="vi">${s.vi}</div><details><summary class="zh">译文</summary>${s.zh}</details></div>${pb(s.id,s.vi)}</div>`).join("")}${r.questions.map(q=>quiz(q.id,q.q,q.options,q.answer)).join("")}${doneBtn('r:'+r.id)}</section>`).join("")},
 review(){const w=store.get("wrong",{}),ids=Object.keys(w);return `<section><h2>复习</h2>${ids.length?`<div class="note">答对后会自动移出这里。</div>`:`<p class="zh">暂时没有错题。去做听辨或阅读题吧。</p>`}
  ${ids.map(i=>{const q=findQ(i);return q?quiz(i,q.q,q.options,q.answer,q.extra):""}).join("")}
  <div class="row"><button class="btn" id="exp">导出进度</button><button class="btn" id="imp">导入进度</button></div></section>`}
};
function findQ(id){
  for(const w of D.tones.words){if("tq-"+w.id===id)return{q:"听音，选声调",options:D.tones.classes,answer:D.tones.classes.indexOf(w.tone),extra:`<div class="row">${pb(w.id,w.vi)}</div>`}}
  for(const l of D.listening){if(l.id===id)return{q:"听音，选意思",options:l.options,answer:l.answer,extra:`<div class="row">${pb(l.say,l.vi)}</div>`}}
  for(const r of D.reading)for(const q of r.questions){if(q.id===id)return q}
}
function renderVocab(){
  const q=norm($("#q").value.trim()),hide=$("#hideZh").checked;
  const list=D.vocab.filter(v=>!q||[v.vi,v.zh,v.en].some(x=>norm(x).includes(q)));
  $("#vlist").innerHTML=list.length?list.map(v=>`<div class="card"><div class="row"><div style="flex:1"><div class="vi" style="font-size:1.2rem">${v.vi}</div><div class="zh ${hide?"hide":""}" data-h>${v.zh} · ${v.en}</div><div class="zh">${v.ex} — <span class="${hide?"hide":""}" data-h>${v.exzh}</span></div></div>${pb("w-"+v.id,v.vi)}</div></div>`).join(""):`<p class="zh">没有找到。换个写法试试，例如去掉声调。</p>`;
}
function show(t){
  cur=t;
  $("#nav").innerHTML=TABS.map(([k,n])=>`<button data-t="${k}" aria-current="${k===t}">${n}</button>`).join("");
  $("#app").innerHTML=VIEWS[t]();
  const tot=D.letters.length+1+D.dialogues.length+D.reading.length;$("#prog").textContent="已学完 "+Object.keys(store.get('done',{})).length+" / "+tot+" 小节";
  if(t==="vocab"){renderVocab();$("#q").oninput=renderVocab;$("#hideZh").onchange=renderVocab}
  if(t==="review"){$("#exp").onclick=()=>{const b=new Blob([JSON.stringify({wrong:store.get("wrong",{})})],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="chao-progress.json";a.click()};
    $("#imp").onclick=()=>{const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=async()=>{try{const j=JSON.parse(await i.files[0].text());store.set("wrong",j.wrong||{});show("review")}catch(e){alert("文件格式不对")}};i.click()}}
}
let rec=null,chunks=[],recs={};
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,.hide");if(!t)return;
  if(t.dataset.t){show(t.dataset.t);scrollTo(0,0)}
  else if(t.dataset.done){const d=store.get('done',{});if(d[t.dataset.done])delete d[t.dataset.done];else d[t.dataset.done]=1;store.set('done',d);const y=scrollY;show(cur);scrollTo(0,y)}
  else if(t.dataset.p){play(t.dataset.p,t.dataset.t,t.dataset.s)}
  else if(t.classList.contains("hide")){t.classList.remove("hide")}
  else if(t.hasAttribute("data-en")){showEn=!showEn;const y=scrollY;show(cur);scrollTo(0,y)}
  else if(t.dataset.i!==undefined){
    const c=t.closest("[data-q]"),a=+c.dataset.a,i=+t.dataset.i,ok=i===a;
    c.querySelectorAll(".opt").forEach((o,k)=>{o.classList.toggle("right",k===a);o.classList.toggle("wrong",k===i&&!ok)});
    c.querySelector(".fb").textContent=ok?"答对了":"再听一遍，注意声调的升降和长短，然后重做";
    if(!ok){setTimeout(()=>{c.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"))},1800)}
    mark(c.dataset.q,ok,ok?null:1);if(ok){let w=store.get("wrong",{});delete w[c.dataset.q];store.set("wrong",w);if(cur==="review")setTimeout(()=>show("review"),700)}
    else{let w=store.get("wrong",{});w[c.dataset.q]=1;store.set("wrong",w)}
  }
  else if(t.dataset.rec){
    if(rec&&rec.state==="recording"){rec.stop();t.textContent="● 录音";return}
    try{
      const s=await navigator.mediaDevices.getUserMedia({audio:true});
      const mt=["audio/webm","audio/mp4"].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||"";
      rec=new MediaRecorder(s,mt?{mimeType:mt}:undefined);chunks=[];
      rec.ondataavailable=ev=>chunks.push(ev.data);
      rec.onstop=()=>{s.getTracks().forEach(x=>x.stop());recs[t.dataset.rec]=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));const p=document.querySelector(`[data-playrec="${t.dataset.rec}"]`);if(p)p.hidden=false};
      rec.start();t.textContent="■ 停止";
    }catch(err){alert("无法录音：需要 HTTPS 并允许麦克风权限")}
  }
  else if(t.dataset.playrec){const u=recs[t.dataset.playrec];if(u)new Audio(u).play()}
});
fetch("data/content.json").then(r=>r.json()).then(d=>{D=d;show("letters")}).catch(()=>{$("#app").innerHTML="<p>课程数据加载失败。本地预览请在文件夹里运行 <code>python3 -m http.server</code>，不要直接双击打开。</p>"});
</script>
</body>
</html>
